name: Build and publish docker image

on:
  push:
    branches:
      - master
  schedule:
    # Weekly rebuild to pick up new ECA releases and base image updates.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build-docker:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get latest ECA release version
        id: eca
        run: |
          version=$(curl -fsSL https://api.github.com/repos/editor-code-assistant/eca/releases/latest | jq -r .tag_name)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ECA_VERSION=${{ steps.eca.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.eca.outputs.version }}
