name: Build and publish docker image

# No `schedule` on purpose: GitHub disables scheduled workflows of public repos
# after 60 days without commits. Every ECA release pushes a commit bumping
# ECA_VERSION in the Dockerfile, which triggers this workflow.
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-docker:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get pinned ECA version
        id: eca
        run: |
          version=$(sed -n 's/^ARG ECA_VERSION=//p' Dockerfile)
          if [ -z "$version" ] || [ "$version" = "latest" ]; then
            echo "::error::Dockerfile must pin ARG ECA_VERSION to an ECA release, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.eca.outputs.version }}
